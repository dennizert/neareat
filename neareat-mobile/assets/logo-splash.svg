<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Eatlas splash logo — şeffaf zemin + Eatlas wordmark -->
  <defs>
    <radialGradient id="coralGrad" cx="0.35" cy="0.30" r="0.85">
      <stop offset="0%"  stop-color="#FF9779"/>
      <stop offset="55%" stop-color="#FF5A3C"/>
      <stop offset="100%" stop-color="#C8341A"/>
    </radialGradient>
    <radialGradient id="amberGrad" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%"  stop-color="#FFE38A"/>
      <stop offset="55%" stop-color="#FFB627"/>
      <stop offset="100%" stop-color="#E18900"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%"  stop-color="#FFB627" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF5A3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.25" r="0.55">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkShine" cx="0.35" cy="0.3" r="0.55">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="biteMask">
      <rect width="1024" height="1024" fill="white"/>
      <circle cx="880" cy="238" r="130" fill="black"/>
      <circle cx="710" cy="298" r="32" fill="black"/>
      <circle cx="758" cy="376" r="32" fill="black"/>
    </mask>
    <clipPath id="globeClip">
      <circle cx="502" cy="480" r="290"/>
    </clipPath>
  </defs>

  <ellipse cx="502" cy="480" rx="400" ry="360" fill="url(#halo)"/>
  <g mask="url(#biteMask)">
    <circle cx="502" cy="480" r="290" fill="url(#coralGrad)"/>
    <ellipse cx="502" cy="480" rx="290" ry="14" fill="none" stroke="#FFD27A" stroke-opacity="0.55" stroke-width="2.5"/>
    <ellipse cx="502" cy="370" rx="270" ry="18" fill="none" stroke="#FFD27A" stroke-opacity="0.45" stroke-width="2"/>
    <ellipse cx="502" cy="590" rx="270" ry="18" fill="none" stroke="#FFD27A" stroke-opacity="0.45" stroke-width="2"/>
    <ellipse cx="502" cy="260" rx="195" ry="16" fill="none" stroke="#FFD27A" stroke-opacity="0.32" stroke-width="2"/>
    <ellipse cx="502" cy="700" rx="195" ry="16" fill="none" stroke="#FFD27A" stroke-opacity="0.32" stroke-width="2"/>
    <line x1="502" y1="192" x2="502" y2="768" stroke="#FFD27A" stroke-opacity="0.50" stroke-width="2.5"/>
    <ellipse cx="502" cy="480" rx="150" ry="290" fill="none" stroke="#FFD27A" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="502" cy="480" r="290" fill="url(#gloss)"/>
  </g>
  <g clip-path="url(#globeClip)">
    <circle cx="880" cy="238" r="130" fill="none" stroke="#7A1A0A" stroke-opacity="0.50" stroke-width="4"/>
    <circle cx="710" cy="298" r="32" fill="none" stroke="#7A1A0A" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="710" cy="298" r="29" fill="none" stroke="#000000" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="758" cy="376" r="32" fill="none" stroke="#7A1A0A" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="758" cy="376" r="29" fill="none" stroke="#000000" stroke-opacity="0.28" stroke-width="2"/>
  </g>
  <circle cx="502" cy="480" r="290" fill="none" stroke="#000000" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="478" cy="522" r="62" fill="url(#amberGrad)"/>
  <ellipse cx="462" cy="506" rx="22" ry="14" fill="url(#sparkShine)"/>
  <ellipse cx="478" cy="590" rx="46" ry="6" fill="#000000" fill-opacity="0.28"/>
  <path d="M 478 584 L 462 560 L 494 560 Z" fill="#E18900" opacity="0.85"/>

  <!-- Eatlas wordmark -->
  <text x="512" y="880" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="92" font-weight="700" fill="#F7F1EA" letter-spacing="4">
    Eatlas
  </text>
  <text x="512" y="932" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="20" font-weight="500" fill="#B9AEC4" letter-spacing="6">
    DÜNYAYI ISIR, LEZZETİ BUL
  </text>
</svg>
