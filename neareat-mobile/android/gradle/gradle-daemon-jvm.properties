# Gradle daemon JVM kriteri.
#
# NOT: `updateDaemonJvm` bu dosyayi uretirken calistigi makinenin JVM'ini ornek alir.
# Android Studio'lu bir makinede calistirildigi icin `toolchainVendor=jetbrains` yazmisti;
# JetBrains Runtime yalnizca IDE ile dagitildigindan JBR'si olmayan her ortamda
# (temiz macOS/Linux, CI) build "Cannot find a Java installation ... vendor matching
# ('jetbrains')" ile kiriliyordu. Android build'i icin herhangi bir JDK 21 yeterli,
# bu yuzden vendor kisiti kaldirildi; surum kisiti korunuyor.
#
# Vendor'i yeniden eklemek gerekirse `updateDaemonJvm` komutunu CALISTIRMAYIN;
# uretilen dosya yine yerel makinenin vendor'ini sabitler.
toolchainVersion=21
