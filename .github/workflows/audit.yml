name: Security audit

# Üretim bağımlılıklarında yüksek/kritik açık birikmesini engelleyen kapı (S12-5).
# Yüksek veya kritik bir açık varsa iş başarısız olur ve PR kırmızıya döner.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neareat-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neareat-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
