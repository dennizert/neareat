name: Tests

# Backend + mobil Jest suite'lerini her PR'da koşan test kapısı (S13-6) ve
# ESLint kapısı (S20-3). Tüm dış servisler (DB/Redis/Firebase/Resend/Anthropic)
# test ortamında mock'lu; gerçek altyapı gerekmez (env tests/setup.js'ten gelir).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neareat-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neareat-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint

  mobile-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neareat-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neareat-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint


  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neareat-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neareat-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Jest suite
        run: npm test

  # Arayüzsüz uçtan uca testler: mobil uygulamanın yerine geçen bir istemci, GERÇEK bir
  # Postgres'e karşı çok adımlı kullanıcı yolculukları koşar (kayıt → rezervasyon → onay).
  # `backend-test`ten AYRI tutuldu: o paket mock'lu ve altyapısız kalmalı ki hızlı kapı
  # bir veritabanı bağımlılığına mahkûm olmasın.
  backend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neareat-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neareat_test
        ports:
          - 5433:5432
        # İş adımları ancak veritabanı yanıt vermeye başlayınca çalışsın.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/neareat_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5433/neareat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neareat-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run E2E journeys
        run: npm run test:e2e

  mobile-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neareat-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neareat-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Jest store tests
        run: npm test
